name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Gate - tag matches package.json and package-lock.json
        run: node scripts/release-version-gate.mjs "$GITHUB_REF_NAME"

      - name: Gate - tag matches CHANGELOG section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/changelog-gate.mjs "$VERSION" --check

      - name: Gate - version already on npm?
        id: npmcheck
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/npm-published-gate.mjs "$VERSION"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run registry:gate

      - name: Pack release artifact
        id: artifact
        run: |
          mkdir -p .release-artifact
          npm pack --json --pack-destination .release-artifact > .release-artifact/pack.json
          node scripts/release-artifact.mjs .release-artifact/pack.json

      - name: Verify existing artifact matches the registry
        if: steps.npmcheck.outputs.published == 'true'
        env:
          REGISTRY_INTEGRITY: ${{ steps.npmcheck.outputs.integrity }}
        run: |
          node scripts/verify-published-artifact.mjs .release-artifact/pack.json "$REGISTRY_INTEGRITY"

      - name: Install Chromium for installed qualification
        run: npx playwright install chromium

      - name: Qualify the exact packed artifact
        run: |
          npm run qualify:installed -- \
            --tarball ".release-artifact/${{ steps.artifact.outputs.filename }}" \
            --fixture-url https://awwwards-mcp.vercel.app/ \
            --report .release-artifact/qualification-report.json

      - name: Gate - qualification evidence matches the release artifact
        env:
          REGISTRY_INTEGRITY: ${{ steps.npmcheck.outputs.integrity }}
          ALREADY_PUBLISHED: ${{ steps.npmcheck.outputs.published }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          ARGS=(
            --report .release-artifact/qualification-report.json
            --tarball ".release-artifact/${{ steps.artifact.outputs.filename }}"
            --filename "${{ steps.artifact.outputs.filename }}"
            --mode tarball
            --package "$PACKAGE_NAME"
            --version "$VERSION"
            --evidence .release-artifact/qualification-gate.json
          )
          if [[ "$ALREADY_PUBLISHED" == "true" ]]; then
            ARGS+=(--integrity "$REGISTRY_INTEGRITY")
          fi
          node scripts/qualify/gate.mjs "${ARGS[@]}"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ github.ref_name }}
          path: |
            .release-artifact/qualification-report.json
            .release-artifact/qualification-gate.json
          if-no-files-found: error

      # The gate hashes the tarball path once. Publication re-reads the same
      # path, so it must not be swapped between the gate and npm publish.
      - name: Publish (beta tag when prerelease)
        if: steps.npmcheck.outputs.published != 'true'
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish ".release-artifact/${{ steps.artifact.outputs.filename }}" --tag beta --provenance
          else
            npm publish ".release-artifact/${{ steps.artifact.outputs.filename }}" --tag latest --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/changelog-gate.mjs "$VERSION" --body > body.md
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            FLAGS="--prerelease"
          else
            FLAGS=""
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "awwwards-mcp ${GITHUB_REF_NAME}" --notes-file body.md
          else
            gh release create "$GITHUB_REF_NAME" $FLAGS --title "awwwards-mcp ${GITHUB_REF_NAME}" --notes-file body.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
