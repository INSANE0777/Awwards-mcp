name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # `main`'s protection requires the contexts `test (22)` and `test (24)`,
    # so the ubuntu rows keep those exact labels; extra platforms get their own.
    name: test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    # Node 22 latest is the supported 22.x line; FTS5 is compiled out of some
    # early 22.x builds, so pinning 22.13.0 would test the fallback path only
    # while most FTS assertions expect the real index.
    # The real-Chromium smoke (test/component-chromium.smoke.ts) runs on the
    # Node 24 entries. Sets AWWWARDS_CHROMIUM_SMOKE so a missing browser is a
    # failure there instead of a quiet skip.
    env:
      AWWWARDS_CHROMIUM_SMOKE: ${{ matrix.browser && '1' || '' }}
      AWWARDS_CHROMIUM_SMOKE: ${{ matrix.browser && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            node: "22"
            browser: false
            label: "22"
          - os: ubuntu-24.04
            node: "24"
            browser: true
            label: "24"
          - os: windows-latest
            node: "24"
            browser: true
            label: "windows-24"
          - os: macos-15
            node: "24"
            browser: true
            label: "macos-24"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # macos-15 is an arm64 runner; fail loudly if it ever is not, so the
      # Apple Silicon coverage this entry promises is real.
      - name: Assert arm64 (Apple Silicon)
        if: matrix.os == 'macos-15'
        run: test "$(uname -m)" = arm64
      # ffmpeg-static downloads a ~80 MB binary from GitHub release assets at
      # install time; that CDN intermittently returns 504 in CI. Every test
      # injects its own ffmpeg stub or path, so CI can skip install scripts and
      # keep the suite independent of that download.
      - name: npm ci (skip native downloads)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --ignore-scripts; then
              exit 0
            fi
            echo "npm ci failed on attempt ${attempt}; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - run: npm run typecheck
      # Chromium only where the browser smoke runs. Ubuntu runners already
      # carry the distro libraries Playwright's bundled build links against;
      # installing them again with --with-deps makes CI depend on apt mirror
      # DNS. Download only, then prove the browser really launches.
      - name: Install Chromium (Linux)
        if: matrix.browser && runner.os == 'Linux'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx playwright install chromium; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "Chromium download failed; retrying in $((attempt * 20))s"
              sleep $((attempt * 20))
            fi
          done
          echo "Chromium install failed after 3 attempts"
          exit 1
      - name: Install Chromium (macOS/Windows)
        if: matrix.browser && runner.os != 'Linux'
        run: npx playwright install chromium
      - name: Assert Chromium launches
        if: matrix.browser
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true, timeout: 30_000 });
          try {
            const page = await browser.newPage();
            await page.setContent('<h1>ready</h1>');
            if (await page.locator('h1').innerText() !== 'ready') {
              throw new Error('Chromium page verification failed');
            }
            console.log(`Chromium ${browser.version()} launched successfully`);
          } finally {
            await browser.close();
          }
          NODE
      - run: npm test -- --maxWorkers=2
        if: runner.os == 'Windows'
      - run: npm test
        if: runner.os != 'Windows'
      # Isolated from the parallel suite: one fixture page, no external network.
      - name: Real-Chromium fixture smoke
        if: matrix.browser
        run: npm run test:browser
      - run: npm run build
      - run: npm run registry:gate
      - run: npm run protocol:smoke
      - run: npm pack --dry-run
      # pack:smoke installs the tarball into a throwaway --prefix (no global
      # state) and handles Windows .cmd shims, so every entry runs it as-is.
      - run: npm run pack:smoke
